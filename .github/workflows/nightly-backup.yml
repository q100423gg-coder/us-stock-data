name: nightly-backup

# Starts the nightly jobs: the macro/earnings job, and the price job followed by the company-data job.
# GitHub's scheduler runs this repository's crons hours late: 3.5 hours at the end of October, 5-8 hours in November
# (the 18:12 UTC cron started between 23:06 and 01:51 UTC; the 12:12 UTC one at 20:48 UTC on 2026-11-17).
# A dispatched run starts right away, so this job is scheduled many hours early, waits until 22:20 UTC (the session's
# bars are final by then) and dispatches the jobs itself. A job may run 6 hours at most: a run with more than 5 hours
# to wait sleeps 5 hours and then hands over to a fresh run of itself, which waits for the rest. The later crons are
# second looks. Every run starts only what has not run (or failed) since 20:00 UTC, so the jobs never run twice in a
# night; runs of this job queue one after another.
# Edit the crons below only in a commit WITHOUT "[skip ci]": GitHub registers a changed schedule while it processes
# the push, and a skipped push left the old schedule in place (2026-11-02: no early start, the morning waited).
on:
  schedule:
    - cron: "12 10 * * 1-5"     # very early: waits (handing over to itself) until 22:20 UTC; covers delays up to ~12 hours
    - cron: "12 12 * * 1-5"     # very early, another chance (on 2026-11-17 it started 8.6 hours late, at 20:48 UTC)
    - cron: "42 13 * * 1-5"     # very early, a second chance
    - cron: "12 18 * * 1-5"     # early, a third chance
    - cron: "20 23 * * 1-5"     # 08:20 KST, a later look
    - cron: "5 0 * * 2-6"       # 09:05 KST, a last look
  workflow_dispatch:
    inputs:
      force:
        description: "Start these even if they already ran today (macro, nightly)"
        default: ""

permissions:
  actions: write
  contents: read

concurrency:
  group: nightly-backup
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 345         # sleeps at most 5 hours, then hands over (the limit for a job is 6 hours)
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      FORCE: ${{ github.event.inputs.force || '' }}
    steps:
      - name: Wait until 22:20 UTC when started early
        run: |
          now=$(date -u +%s); target=$(date -u -d "today 22:20" +%s)
          if [ "$(date -u +%H)" -ge 10 ] && [ "$now" -lt "$target" ]; then
            left=$(( target - now ))
            if [ "$left" -gt 18000 ]; then
              echo "started $(date -u +%H:%M) UTC, $(( left / 60 )) minutes before 22:20 UTC: sleeping 5 hours, then a fresh run waits for the rest"
              sleep 18000
              gh workflow run nightly-backup.yml && echo "HANDED_OVER=1" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "started $(date -u +%H:%M) UTC; waiting $(( left / 60 )) minutes until 22:20 UTC"
            sleep "$left"
          fi
      - name: Start the nightly jobs that did not run
        if: env.HANDED_OVER != '1'
        run: |
          set -u
          # the evening's window starts at the last 20:00 UTC (this job starts the nightly jobs at 22:20 UTC)
          if [ "$(date -u +%H)" -lt 20 ]; then day=yesterday; else day=today; fi
          since=$(date -u -d "$day 20:00" +%Y-%m-%dT%H:%M:%SZ)
          echo "runs since $since"
          # runs of a workflow since then that are still going or that succeeded
          alive() {
            gh run list --workflow "$1" --limit 20 --json status,conclusion,createdAt \
              --jq "[.[] | select(.createdAt >= \"$since\") | select(.status != \"completed\" or .conclusion == \"success\")] | length"
          }
          forced() { case ",$FORCE," in *",$1,"*) return 0;; esac; return 1; }

          m=$(alive macro.yml) || m=""
          if [ -z "$m" ]; then
            echo "::warning::could not list the macro-and-earnings runs; leaving it alone"
          elif [ "$m" -eq 0 ] || forced macro; then
            echo "macro-and-earnings did not run since $since: starting it"
            gh workflow run macro.yml
          else
            echo "macro-and-earnings ran or is running"
          fi

          p=$(alive nightly-prices.yml) || p=""
          if [ -z "$p" ]; then
            echo "::warning::could not list the nightly-prices runs; leaving it alone"
            exit 0
          fi
          if [ "$p" -gt 0 ] && ! forced nightly; then
            echo "nightly-prices ran or is running: nothing to do"
            exit 0
          fi
          echo "nightly-prices did not run since $since: starting it"
          t0=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run nightly-prices.yml
          id=""
          for i in $(seq 1 20); do
            sleep 15
            id=$(gh run list --workflow nightly-prices.yml --event workflow_dispatch --limit 5 --json databaseId,createdAt \
                   --jq "[.[] | select(.createdAt >= \"$t0\")] | .[0].databaseId // empty")
            [ -n "$id" ] && break
          done
          if [ -z "$id" ]; then echo "::warning::the started nightly-prices run did not show up"; exit 0; fi
          gh run watch "$id" --interval 30 --exit-status > /dev/null || echo "::warning::nightly-prices run $id did not succeed"
          # the company-data job normally follows the price job by itself; start it if it has not within 2 minutes
          sleep 120
          n=$(gh run list --workflow fundamentals.yml --limit 10 --json createdAt --jq "[.[] | select(.createdAt >= \"$t0\")] | length")
          if [ "$n" -eq 0 ]; then
            echo "fundamentals did not follow: starting it"
            gh workflow run fundamentals.yml
          else
            echo "fundamentals followed the price job"
          fi
