name: probe-sources

# temporary: long price histories for a strategy study; results go to the `data` release as probe.tar.gz
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "research_probe.py"
      - ".github/workflows/probe.yml"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install --quiet --upgrade yfinance pandas

      - name: Probe
        run: timeout 900 python research_probe.py || true

      - name: Upload results
        if: always()
        run: |
          tar czf probe.tar.gz probe_out
          gh release upload data probe.tar.gz --clobber
        env:
          GH_TOKEN: ${{ github.token }}
