name: macro-and-earnings

on:
  schedule:
    # 22:05 UTC, Mon-Fri (07:05 KST): before the price job, so the files are ready for the morning refresh
    - cron: "5 22 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "macro.py"
      - ".github/workflows/macro.yml"

permissions:
  contents: write

concurrency:
  group: macro-and-earnings
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch FRED series and the Nasdaq earnings calendar
        run: python macro.py

      - name: Publish release assets
        run: |
          gh release view data >/dev/null 2>&1 || gh release create data --title "Daily US prices" --notes "Updated by the nightly workflows. Download: releases/download/data/<file>"
          for f in out/macro.json out/earnings_calendar.json; do
            if [ -s "$f" ]; then gh release upload data "$f" --clobber; fi
          done
        env:
          GH_TOKEN: ${{ github.token }}
