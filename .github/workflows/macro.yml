name: macro-and-earnings

on:
  # started every weekday night at 22:20 UTC by nightly-backup.yml (GitHub's own cron for this job ran hours late)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "macro.py"
      - ".github/workflows/macro.yml"

permissions:
  contents: write

concurrency:
  group: macro-and-earnings
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install --quiet requests

      - name: Fetch FRED series and the Nasdaq earnings calendar
        run: timeout 720 python macro.py

      - name: Publish release assets (whatever was fetched, plus a status file)
        if: always()
        run: |
          gh release view data >/dev/null 2>&1 || gh release create data --title "Daily US prices" --notes "Updated by the nightly workflows. Download: releases/download/data/<file>"
          for f in out/macro.json out/earnings_calendar.json out/nasdaq100.json out/macro_status.json; do
            if [ -s "$f" ]; then gh release upload data "$f" --clobber; fi
          done
        env:
          GH_TOKEN: ${{ github.token }}
